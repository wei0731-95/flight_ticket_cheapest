name: 機票監控

on:
  schedule:
    # 每 6 小時一次（UTC）。台北時間約 02:05 / 08:05 / 14:05 / 20:05。
    # 注意：GitHub 只會在「預設分支」上執行排程，分支上的排程不會觸發。
    - cron: "5 */6 * * *"
  workflow_dispatch:
    inputs:
      debug_dump:
        description: 儲存頁面 HTML / XHR JSON / 截圖（用來對照 trip.com 實際結構）
        type: boolean
        default: false
      force_email:
        description: 不論有無新低都寄一封信
        type: boolean
        default: false
      dry_run:
        description: 只查詢並印出結果，不寄信也不寫入歷史
        type: boolean
        default: false
      only:
        description: 只跑 key 含這段字的查詢（診斷用，例如 TPE-PQC_2027-02-09_2027-02-13）
        type: string
        default: ""

# 兩次執行同時寫入 price_history.json 會互相覆蓋，所以排隊而不取消。
concurrency:
  group: watch-fares
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 安裝套件
        run: pip install -r requirements.txt

      - name: 安裝 Chromium
        run: python -m playwright install --with-deps chromium

      - name: 執行查詢
        env:
          PYTHONPATH: src
          PYTHONUNBUFFERED: "1"
          SMTP_HOST: ${{ secrets.SMTP_HOST || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          # 手動觸發才有值；排程觸發時這些是空的，等於全部不加。
          DEBUG_DUMP: ${{ github.event.inputs.debug_dump }}
          FORCE_EMAIL: ${{ github.event.inputs.force_email }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          ONLY: ${{ github.event.inputs.only }}
        run: |
          set -o pipefail
          args=()
          if [ "$DEBUG_DUMP" = "true" ]; then args+=(--debug-dump); fi
          if [ "$FORCE_EMAIL" = "true" ]; then args+=(--force-email); fi
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          if [ -n "$ONLY" ]; then args+=(--only "$ONLY"); fi
          python -m tripcom_watcher run "${args[@]}" 2>&1 | tee run.log

      - name: 把結果寫進執行摘要
        if: always()
        run: |
          {
            echo '## 本次查詢結果'
            echo '```'
            tail -200 run.log 2>/dev/null || echo '（沒有輸出）'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 保存價格歷史
        if: github.event.inputs.dry_run != 'true'
        run: |
          # --porcelain also catches the very first run, when the file is untracked.
          if [ -z "$(git status --porcelain -- data/price_history.json)" ]; then
            echo "歷史沒有變動，不需要 commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/price_history.json
          git commit -m "chore: 更新機票價格歷史 ($(date -u '+%Y-%m-%d %H:%M UTC'))"
          # 另一個排程可能剛好也推了一版，所以先 rebase 再推，並重試幾次。
          for attempt in 1 2 3 4; do
            if git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && \
               git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "已推送歷史更新"
              exit 0
            fi
            echo "第 ${attempt} 次推送失敗，等待後重試"
            sleep $((attempt * attempt * 2))
          done
          echo "::warning::價格歷史推送失敗，本次結果沒有保存"

      - name: 上傳 debug 快照
        if: always() && github.event.inputs.debug_dump == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: debug-snapshot-${{ github.run_number }}
          path: debug/
          if-no-files-found: ignore
          retention-days: 14
